{{- define "main" }}
<section class="list">
{{- $paginator := .Paginator }}
{{- range $paginator.Pages }}
	<article>
		<h1 class="article-title">
			<a href="{{ .Permalink | relURL }}" class="title">
				{{ .Title }}
			</a>
		</h1>
		<time>{{ .Date.Format (default "January 2, 2006" $.Site.Params.dateFormat) }}</time>

		<section class="content">
			{{- if .Truncated }}
				{{ .Summary }}
			{{- else }}
				{{ .Content }}
			{{- end }}
		</section>

		<footer>
			<a href="{{ .Permalink | relURL }}" rel="canonical">Read more...</a>
		</footer>
	</article>	
{{- end }}
</section>
{{- end }}
