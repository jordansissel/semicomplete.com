<!DOCTYPE html>
<html lang="en-US">
<head>
	<link rel="stylesheet" href="{{ "highlight.css" | relURL }}" media="all">
	<link rel="stylesheet" href="{{ "style.css" | relURL }}" media="all">
	<meta name="viewport" content="width=device-width">
</head>
<body>
		<header>
			<nav>
				<h1><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
				<ul class="navigation">
					{{- range .Site.Menus.main }}
					<li class="navigation-{{ .Identifier }}"><a href="{{ .URL | safeURL }}" title="{{ .Name }}">{{ .Name }}</a></li>
					{{- end }}
				</ul>
			</nav>
		</header>
		<main> {{ block "main" . }}{{ end }} </main>
		<footer>
		</footer>
</body>
</html>
